<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piles! - Lobby</title>
    <!-- PWA: instalable. El service worker (sw.js) es red primero; ver su comentario. -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#060606">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
    <!-- con conexión lenta el medio salía en blanco un tiempo. Con esto, se descarga
    mientras el jugador está en el menú o esperando en la sala. -->
    <link rel="preload" as="image" href="cards.webp" fetchpriority="high">
    <!-- qr-scanner 1.4.2 (nimiq, MIT), vendorizado.
         sha384-np0yBqru4jLMa2u0xLtxD3WvMtkLuNiMNQwxQ8GT132ygYFONACD2xc33tx1avQz
         Usa BarcodeDetector nativo cuando existe y carga su propio worker
         (qr-scanner-worker.min.js, sha384-irhTGf70Ryc7WyNLyAljPrpg7lTLXwg5Qb
         Ysw40uLuCdAa4ziKF5DVclab4C7uxc) en el resto — iOS y Firefox incluidos.
         Ambos ficheros viven en la raíz de client/ a propósito: el worker se
         carga con un import() relativo que, desde un script clásico, se
         resuelve contra la URL del documento (/lobby.html) -->
    <!-- Idiomas (es / en / zh): diccionarios y t(); ver el comentario de i18n.js. -->
    <script src="/i18n.js"></script>
    <!-- Gestos (deslizar para desbloquear, borde = atrás, revelar con ↓↓): ver gestos.js. -->
    <link rel="stylesheet" href="/gestos.css">
    <script src="/gestos.js" defer></script>
    <script src="/qr-scanner.umd.min.js"></script>
    <!-- Identidad común (github.com/ZBishopM/agapornis-ui): superficies,
         tinta, acento sage, Geist. Solo la interfaz; los efectos del juego
         (combo, cartas, frenesí) conservan sus colores propios. -->
    <link rel="stylesheet" href="/agapornis-ui/agapornis.css">
    <script src="/agapornis-ui/toast.js" defer></script>
    <script src="/agapornis-ui/rank.js" defer></script>
    <script src="/agapornis-ui/rank-fx.js" defer></script>
    <script src="/agapornis-ui/dial.js" defer></script>
    <!-- El menú en la mesa (diseno/menu-mesa/README.md). Después de dial.js. -->
    <link rel="stylesheet" href="/mesa/mesa.css">
    <script src="/mesa/mesa.js" defer></script>
    <!-- La partida con el mismo estilo y sin franjas de texto (partida/partida.js). Su CSS va
         al final del <head>, detrás de lobby.css: a igual especificidad, manda el suyo. -->
    <script src="/partida/partida.js" defer></script>
    <link rel="preload" as="image" href="/mesa/siluetas.webp">
    <link rel="stylesheet" href="/lobby.css">
    <link rel="stylesheet" href="/partida/partida.css">
</head>
<body>

<!-- ════ MENÚ EN LA MESA ════ (mesa/mesa.js). El primero del body: los avisos, el diálogo del
     Elo y el de reconexión, que van detrás en el DOM, quedan encima. -->
<div id="escenario" data-p="inicio" data-sin-gestos>
    <div class="frag f1"></div><div class="frag f2"></div><div class="frag f3"></div>
    <canvas id="juego" aria-hidden="true"></canvas>
    <div class="velo" aria-hidden="true"></div>
    <div id="titulo">PILES<span>!</span></div>
    <input id="nombre" type="text" aria-label="Tu nombre" data-i18n-attr="aria-label:home.name" maxlength="20" autocomplete="nickname">
    <div id="diales" aria-hidden="true"><div class="dialMesa"></div><div class="dialMesa"></div><div class="dialMesa"></div><div class="dialMesa"></div></div>
    <div id="cartas" role="listbox" aria-label="Menú"></div>
    <div class="pieza oculta" id="p1"></div><div class="pieza oculta" id="p2"></div><div class="pieza oculta" id="p3"></div>
    <input id="campo" type="text" autocomplete="off" aria-label="Escribe">
    <p id="estado" role="status" aria-live="polite"></p>
    <div id="barrido" aria-hidden="true"></div>
</div>

<!-- Elegir qué Elo se queda al vincular. Lo abre linkAccountElo. -->
<div id="eloChoice" class="elo-choice" hidden>
    <div class="elo-choice-box dialog-in" role="dialog" aria-modal="true" aria-labelledby="eloChoiceTitle">
        <h3 id="eloChoiceTitle"></h3>
        <p id="eloChoiceText"></p>
        <div class="elo-choice-actions">
            <button type="button" class="btn btn-secondary" id="eloChoiceB"></button>
            <button type="button" class="btn btn-primary" id="eloChoiceA"></button>
        </div>
    </div>
</div>
<!-- El vídeo del escáner de QR: no se ve aquí, la mesa lo dibuja en el centro (mesa/ui.part.js) -->
<div id="scanWrap">
    <video id="scanVideo" playsinline muted autoplay></video>
</div>
<!-- La cuenta atrás la forman las cartas de la mesa; esto solo la anuncia al lector de pantalla -->
<div id="cuentaAnuncio" class="pt-sr" role="status" aria-live="assertive" aria-atomic="true"></div>

<!-- ════ GAME ════ -->
<div id="gameScreen" class="screen">

    <!-- Marcador: una franja por jugador, hasta 8, en rejilla.
         Lleva lo que antes estaba repartido entre la cabecera de arriba
         (nombre y sets cerrados) y el panel de abajo (qué sets ha revelado
         cada uno). Estaban lejos el uno del otro y el de abajo empujaba el
         tablero fuera de la pantalla. -->
    <div class="hud" id="hud"></div>
    <button id="muteBtn" type="button" onclick="toggleMute()" title="Silenciar" data-i18n-attr="title:game.mute">🔊</button>

    <!-- Hint de intercambio -->
    <div id="swapHint" data-i18n-html="game.swaphint">Selecciona una carta de <strong>tu set</strong> o del <strong>centro</strong> para intercambiar</div>

    <!-- Franja de estado de alto FIJO (como la de zeron). Combo, deuda y
         bloqueo aparecen y desaparecen muchas veces por partida; si cada uno
         entrara y saliera del flujo, todo lo de abajo —los botones de set y
         tus cartas— saltaría 16–64 px en cada swap y el clic caería en otro
         sitio (medido en beta el 2026-09-28). Aquí solo cambia su visibilidad. -->
    <div id="statusStrip">
    <!-- Cuenta atrás del bloqueo por perder una pelea -->
    <div id="stunBar"><div id="stunBarFill"></div></div>

    <!-- Plazo para tapar el hueco. Si se agota, el servidor asigna una carta. -->
    <div id="debtBar"><div id="debtBarFill"></div></div>

    <!-- Racha. La ventana la manda el servidor; aquí solo se anima la barra,
         igual que con el bloqueo de arriba. -->
    <!-- Racha. Un número y ya: el multiplicador, con su color. Lo que decía
         cuántos eslabones llevabas no lo entendía nadie y era texto de más.
         La barra se queda sin etiqueta porque es lo único que avisa de que se
         te acaba el tiempo. -->
    <div id="comboBox" aria-live="polite">
        <span id="comboMult">×1</span>
        <div class="combo-bar"><div id="comboBarFill"></div></div>
        <!-- Aparece al llegar a x5. Se puede soltar, o guardar para parar el de
             otro: mientras lo tengas cargado, su frenesí no te bloquea. -->
        <button id="frenzyBtn" type="button" hidden onclick="fireFrenzy()" data-i18n="frenzy.btn">FRENZY</button>
    </div>
    </div><!-- /statusStrip -->

    <!-- Centro -->
    <p class="section-label" data-i18n="game.center">Cartas del Centro</p>
    <div class="card-row" id="centerCards"></div>

    <!-- Navegación de sets. El botón de revelar va aquí arriba, a la altura
         del título: debajo de las cartas quedaba fuera del recorrido de la
         vista y no se encontraba con las prisas. -->
    <div class="section-head">
        <p class="section-label" data-i18n="game.sets">Tus Sets</p>
        <!-- Con el dedo se revela deslizando ↓↓ sobre las cartas (gestos.js); el botón
             queda para el teclado. -->
        <button id="flipBtn" class="solo-teclado" onclick="flipCurrentSet()"
                title="Mostrar este set a los demás jugadores"
                data-i18n-attr="title:game.fliptitle" data-i18n="game.flip">👁 Revelar set</button>
    </div>
    <div class="set-nav" id="setNav"></div>

    <!-- Cards del set actual -->
    <div class="card-row" id="yourCards"></div>

    <!-- Solo para quien mira: la mano de todos. «Mirando desde» elige a quién
         ves, o «Todos» para los sets de cada uno en miniatura. Se pinta desde
         `spectator_state` (ids de carta) y la tabla `spectator_cards`. -->
    <div id="specBoard">
        <div class="spec-seats" id="specSeats"></div>
        <div id="specSingle">
            <div class="section-label" id="specLabel"></div>
            <div class="set-nav" id="specSetNav"></div>
            <div class="card-row" id="specCards"></div>
            <div class="spec-estado" id="specEstado"></div>
        </div>
        <div id="specAll" hidden></div>
    </div>

</div>

<!-- Notificaciones de verificación de otros jugadores -->
<div id="verifyNotifications" style="position:fixed;top:12px;right:12px;z-index:50;width:200px;display:flex;flex-direction:column;gap:8px;pointer-events:none;"></div>

<!-- ════ OVERLAY VERIFICACIÓN ════ -->
<div id="verifyOverlay">
    <div class="verify-box">
        <h2 id="verifyTitle">Verificando...</h2>
        <div id="verifySets"></div>
        <div class="verify-footer" id="verifyFooter"></div>
        <button id="verifyCloseBtn" onclick="closeVerifyOverlay()" data-i18n="common.close">Cerrar</button>
    </div>
</div>

<!-- ════ OVERLAY PELEA ════ -->
<div id="qteOverlay">
    <div class="qte-box" id="qteBox">
        <h2 id="qteTitle" role="status" aria-live="polite" data-i18n="qte.title">⚡ ¡CLICK!</h2>
        <p class="qte-desc" id="qteDesc" aria-live="polite"></p>
        <!-- La carta en disputa: se ve por qué se está peleando, sin leer nada -->
        <div class="qte-card-slot" id="qteCard"></div>
        <div class="qte-scores" id="qteScores"></div>
        <div class="qte-timer-bar"><div id="qteTimerFill"></div></div>
        <!-- Sin onclick propio: quien recibe el toque es el overlay entero, que
             ocupa la pantalla. Con el botón también escuchando, un toque encima
             contaría dos veces. `pointer-events: none` lo deja de adorno. -->
        <button id="qteClickBtn" style="display:none" data-toque data-i18n="qte.btn">¡ C L I C K !</button>
    </div>
    <!-- Ceder la carta. Sin texto: una bandera blanca se entiende sola.
         Hay que MANTENERLA pulsada, y eso no es un capricho: durante la pelea
         toda la pantalla es el botón de pulsar, así que cualquier cosa que se
         active con un toque se dispararía sola a los dos segundos de machacar.
         Un dedo que se queda quieto no sale por accidente. -->
    <button id="qteGiveUpBtn" type="button" hidden data-toque
            title="Mantén pulsado para ceder la carta"
            data-i18n-attr="title:qte.giveup;aria-label:qte.giveup">🏳️<i></i></button>
</div>

<!-- ════ OVERLAY GAME OVER ════ -->
<div id="gameOverOverlay">
    <div class="gameover-box">
        <h2 data-i18n="over.title">🏆 Fin del Juego</h2>
        <!-- Tu Elo, girando desde el que tenías. Vacío si no hay Elo. -->
        <div id="eloDial" hidden></div>
        <div id="rankingList"></div>
        <p id="smClaimStatus" style="font-size:0.85rem;opacity:0.85;margin-top:10px;"></p>
        <button class="btn btn-primary" style="margin-top:24px" onclick="returnToLobby()" data-i18n="over.back">Volver al Lobby</button>
    </div>
</div>

<!-- ════ OVERLAY RECONEXIÓN ════ -->
<!-- Cartas volando entre el centro y tu set -->
<div id="fxLayer"></div>

<!-- El estilo, en partida.css (el de la mesa). display lo cambia el JS: none / flex. -->
<div id="reconnectOverlay" style="display:none">
    <div class="rc-caja">
        <svg class="rc-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" aria-hidden="true"><path d="M9 2v5M15 2v5M6 7h12v4a6 6 0 0 1-12 0zM12 17v5"/></svg>
        <h2 data-i18n="recon.title">Conexión perdida</h2>
        <p id="reconnectMsg" data-i18n="recon.msg">La conexión con el servidor se interrumpió.</p>
        <button class="btn btn-primary" onclick="reconnect()" data-i18n="recon.btn">Reconectar</button>
        <button class="btn btn-secondary" onclick="location.reload()" data-i18n="recon.reload">Recargar página</button>
    </div>
</div>

<!-- La lógica del juego, en orden (scripts clásicos: comparten las globales). -->
<script src="/juego/bus.js"></script>
<script src="/juego/estado.js"></script>
<script src="/juego/red.js"></script>
<script src="/juego/sala.js"></script>
<script src="/juego/espectador.js"></script>
<script src="/juego/tablero.js"></script>
<script src="/juego/sonido.js"></script>
<script src="/juego/burlas.js"></script>
<script src="/juego/musica.js"></script>
<script src="/juego/toques.js"></script>
<script src="/juego/pelea.js"></script>
<script src="/juego/verificacion.js"></script>
<script src="/juego/cuenta.js"></script>
</body>
</html>
