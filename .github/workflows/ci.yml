name: CI

# Tests y build en cada push a beta/master y en cada PR. El binario se sube
# como artifact: es el MISMO que después promueve promote.yml a producción
# (build once, deploy many). En beta se despliega solo en
# https://beta.piles.agapornis.app. Ver DEPLOY.md, "CI y deploy".
#
# El deploy no hace nada hasta que el repo tenga la variable DEPLOY_HOST y el
# secret SSH_KEY, así que un fork sin VPS nunca falla por esto.

on:
  push:
    branches: [beta, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test + build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Tests
        run: cargo test --locked

      # cargo test regenera con ts-rs los tipos del protocolo (client/tipos): si
      # cambió un mensaje y no se subieron, falla.
      - name: client/tipos al día
        run: |
          if [ -n "$(git status --porcelain -- ../client/tipos)" ]; then
            git status --short -- ../client/tipos
            echo "client/tipos no corresponde a messages.rs: cargo test en server/ y commit"; exit 1
          fi

      - name: Build release
        run: cargo build --release --locked

      - uses: actions/upload-artifact@v7
        with:
          name: piles-server
          path: server/target/release/piles-server
          if-no-files-found: error
          retention-days: 90

  client:
    name: Cliente (client/dist al día)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v6

      # pnpm en la versión de tools/package.json (packageManager), con el corepack de Node.
      - name: pnpm
        run: corepack enable && pnpm --version

      - run: pnpm install --frozen-lockfile

      - name: TypeScript (tsc estricto)
        run: pnpm check

      # client/dist se sirve tal cual desde git (el VPS no compila): tiene que ser
      # exactamente lo que sale de la fuente.
      - name: client/dist = pnpm build
        run: |
          pnpm build
          git diff --exit-code -- ../client/dist || { echo "client/dist no corresponde a la fuente: pnpm build en tools/ y commit"; exit 1; }

  deploy-beta:
    name: Deploy beta
    needs: [build, client]
    if: github.event_name == 'push' && github.ref == 'refs/heads/beta' && vars.DEPLOY_HOST != ''
    runs-on: ubuntu-24.04
    environment: beta
    concurrency: beta
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: piles-server

      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          SHA: ${{ github.sha }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          DEST="bicho@$HOST"
          # Compilado en el job de build: el VPS no tiene swap y compilar allí
          # compite con el correo y la base de datos.
          scp piles-server "$DEST:piles-beta/server/target/release/piles-server.new"
          ssh "$DEST" bash -s -- "$SHA" <<'EOF'
          set -e
          cd ~/piles-beta
          git fetch -q origin beta
          git merge -q --ff-only "$1"
          # El artifact no conserva el bit de ejecución.
          chmod 755 server/target/release/piles-server.new
          mv server/target/release/piles-server.new server/target/release/piles-server
          pm2 restart piles-beta --update-env >/dev/null
          sleep 2
          curl -fsS http://127.0.0.1:3010/health >/dev/null
          echo "beta en $(git log -1 --format=%h)"
          EOF
