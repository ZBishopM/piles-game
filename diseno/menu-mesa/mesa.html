<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menú de Piles en la mesa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
/* Menús que siguen siendo menús, sobre una partida de mentira: las opciones son cartas en
   una mano horizontal; se eligen deslizando de lado (las cartas se intercambian) y se
   juegan lanzándolas a la pila del centro, que reparte el menú siguiente. La carta jugada
   se queda arriba como cabecera. Fondo anguloso que se deforma en cada jugada. */
:root {
    --bg: #060606;          /* agapornis-ui */
    --tinta: #0e0e0e;
    --texto: #e8e8ea;
    --tenue: #a9a9ae;
    --salvia: #a9b689;
    --militar: #4b5320;
    --hueso: #e9e6da;
    --acento: #e8402a; --sobreAcento: var(--tinta);   /* bermellón */   /* el único color de acción: lo elegido y lo que se mueve */
    --sans: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
    --rebote: cubic-bezier(.34, 1.56, .64, 1);
    --golpe: cubic-bezier(.7, 0, .2, 1);
    --cw: 128px; --ch: 176px;    /* carta-botón */
    color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--texto); font-family: var(--sans); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
#escenario { position: fixed; inset: 0; overflow: hidden; isolation: isolate; }

/* ── Fondo: fragmentos que se deforman (5 vértices, se interpolan) ─────────── */
.frag { position: absolute; inset: -6%; z-index: -5; transition: clip-path 760ms var(--golpe); }
.frag::after { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgb(0 0 0 / 22%) 1.1px, transparent 1.5px); background-size: 8px 8px; }
.f1 { background: var(--militar); }
.f2 { background: var(--salvia); }
.f3 { background: var(--hueso); }
[data-p="inicio"] .f1 { clip-path: polygon(0 0, 70% 0, 44% 46%, 0 58%, 0 30%); }
[data-p="inicio"] .f2 { clip-path: polygon(100% 0, 100% 22%, 78% 30%, 72% 0, 90% 0); }
[data-p="inicio"] .f3 { clip-path: polygon(70% 0, 73% 0, 46% 47%, 43% 48%, 58% 22%); }
[data-p="crear"] .f1, [data-p="perfil"] .f1 { clip-path: polygon(30% 0, 100% 0, 100% 40%, 60% 52%, 20% 14%); }
[data-p="crear"] .f2, [data-p="perfil"] .f2 { clip-path: polygon(0 0, 22% 0, 10% 30%, 0 34%, 0 14%); }
[data-p="crear"] .f3, [data-p="perfil"] .f3 { clip-path: polygon(19% 13%, 22% 12%, 62% 51%, 59% 53%, 40% 30%); }
[data-p="unirse"] .f1, [data-p="tutorial"] .f1 { clip-path: polygon(0 12%, 100% 0, 100% 30%, 50% 40%, 0 44%); }
[data-p="unirse"] .f2, [data-p="tutorial"] .f2 { clip-path: polygon(64% 30%, 100% 26%, 100% 40%, 80% 44%, 66% 42%); }
[data-p="unirse"] .f3, [data-p="tutorial"] .f3 { clip-path: polygon(0 43%, 50% 39%, 100% 29%, 100% 31%, 0 45.5%); }
[data-p="sala"] .f1, [data-p="bots"] .f1 { clip-path: polygon(0 0, 100% 0, 100% 16%, 40% 24%, 0 20%); }
[data-p="sala"] .f2, [data-p="bots"] .f2 { clip-path: polygon(0 20%, 40% 24%, 46% 30%, 10% 34%, 0 32%); }
[data-p="sala"] .f3, [data-p="bots"] .f3 { clip-path: polygon(0 19.5%, 40% 23.5%, 100% 15.5%, 100% 17%, 0 21%); }
/* Submenús de segundo nivel: el mismo fragmento, girado hacia el otro lado */
[data-p="privacidad"] .f1, [data-p="burla"] .f1 { clip-path: polygon(0 0, 60% 0, 100% 34%, 100% 48%, 0 22%); }
[data-p="privacidad"] .f2, [data-p="burla"] .f2 { clip-path: polygon(78% 0, 100% 0, 100% 20%, 92% 26%, 80% 10%); }
[data-p="privacidad"] .f3, [data-p="burla"] .f3 { clip-path: polygon(0 21%, 2% 20%, 100% 46%, 100% 49%, 50% 36%); }
[data-p="idioma"] .f1, [data-p="codigo"] .f1 { clip-path: polygon(0 30%, 100% 8%, 100% 36%, 60% 44%, 0 50%); }
[data-p="idioma"] .f2, [data-p="codigo"] .f2 { clip-path: polygon(0 0, 30% 0, 24% 20%, 0 26%, 0 10%); }
[data-p="idioma"] .f3, [data-p="codigo"] .f3 { clip-path: polygon(0 49%, 60% 43%, 100% 35%, 100% 37.5%, 0 51.5%); }
/* Pantallas de la escena (vistas de lado o desde arriba): reutilizan los fragmentos de su menú padre */
[data-p="oferta"] .f1, [data-p="echar"] .f1 { clip-path: polygon(0 0, 100% 0, 100% 16%, 40% 24%, 0 20%); }
[data-p="oferta"] .f2, [data-p="echar"] .f2 { clip-path: polygon(0 20%, 40% 24%, 46% 30%, 10% 34%, 0 32%); }
[data-p="oferta"] .f3, [data-p="echar"] .f3 { clip-path: polygon(0 19.5%, 40% 23.5%, 100% 15.5%, 100% 17%, 0 21%); }
[data-p="rangos"] .f1, [data-p="sm"] .f1, [data-p="smElo"] .f1 { clip-path: polygon(0 0, 60% 0, 100% 34%, 100% 48%, 0 22%); }
[data-p="rangos"] .f2, [data-p="sm"] .f2, [data-p="smElo"] .f2 { clip-path: polygon(78% 0, 100% 0, 100% 20%, 92% 26%, 80% 10%); }
[data-p="rangos"] .f3, [data-p="sm"] .f3, [data-p="smElo"] .f3 { clip-path: polygon(0 21%, 2% 20%, 100% 46%, 100% 49%, 50% 36%); }
[data-p="mirar"] .f1 { clip-path: polygon(0 12%, 100% 0, 100% 30%, 50% 40%, 0 44%); }
[data-p="mirar"] .f2 { clip-path: polygon(64% 30%, 100% 26%, 100% 40%, 80% 44%, 66% 42%); }
[data-p="mirar"] .f3 { clip-path: polygon(0 43%, 50% 39%, 100% 29%, 100% 31%, 0 45.5%); }
/* Desde arriba (QR, cuenta atrás, visor): los fragmentos se apartan a los bordes, que el QR se lea */
[data-p="qr"] .f1, [data-p="cuenta"] .f1, [data-p="visor"] .f1 { clip-path: polygon(0 0, 9% 0, 4% 100%, 0 100%, 0 50%); }
[data-p="qr"] .f2, [data-p="cuenta"] .f2, [data-p="visor"] .f2 { clip-path: polygon(93% 0, 100% 0, 100% 100%, 97% 100%, 95% 40%); }
[data-p="qr"] .f3, [data-p="cuenta"] .f3, [data-p="visor"] .f3 { clip-path: polygon(0 99%, 100% 98%, 100% 99%, 50% 100%, 0 100%); }
[data-p="partida"] .f1 { clip-path: polygon(0 60%, 100% 50%, 100% 100%, 50% 100%, 0 100%); }
[data-p="partida"] .f2 { clip-path: polygon(0 0, 100% 0, 100% 6%, 50% 9%, 0 7%); }
[data-p="partida"] .f3 { clip-path: polygon(0 59%, 100% 49%, 100% 51%, 50% 56%, 0 61%); }

/* La partida de fondo (canvas): gente jugando a cámara lenta; la cámara cambia en cada menú */
#juego { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -4; }
.frag { opacity: .55; }   /* detrás del canvas: la mesa y las figuras los tapan (la mesa no se ve transparente) */

/* La mano también cambia de ángulo con cada menú (como el tablero al cambiar de set) */
#cartas { position: absolute; inset: 0; perspective: 900px; perspective-origin: 50% calc(100% - 140px); transform-style: preserve-3d; }   /* el ojo, a la altura de la mano: inclinada no crece */
#cartas > .carta { transform: translate(var(--x), var(--y)) rotateY(var(--ry, 0deg)) rotateX(var(--rxm, 0deg)) rotate(var(--r)) scale(var(--s)); }
/* La cabecera y los jugadores no se inclinan: siempre en el mismo sitio y alineados */
#cartas > .carta.cabecera, #cartas > .carta.jugador { transform: translate(var(--x), var(--y)) rotate(var(--r)) scale(var(--s)); }
[data-p="inicio"] { --ry: 0deg; --rxm: 6deg; }
[data-p="crear"] { --ry: -14deg; --rxm: 10deg; }
[data-p="unirse"] { --ry: 14deg; --rxm: 8deg; }
[data-p="sala"], [data-p="bots"] { --ry: -6deg; --rxm: 16deg; }
[data-p="perfil"], [data-p="privacidad"] { --ry: 12deg; --rxm: 4deg; }
[data-p="tutorial"], [data-p="codigo"] { --ry: -10deg; --rxm: 12deg; }
[data-p="burla"], [data-p="idioma"] { --ry: 18deg; --rxm: 10deg; }
/* Campo de texto que sale cuando hace falta escribir (código, chat, Session Manager) */
#campo { position: absolute; left: 50%; z-index: 14; width: min(320px, calc(100vw - 32px)); translate: -50% 0; font: 800 1.1rem var(--sans); color: var(--tinta); background: var(--hueso); border: none; padding: 10px 14px; box-shadow: inset 0 0 0 2px var(--tinta); clip-path: polygon(0 6%, 100% 0, 97% 100%, 2% 94%); opacity: 0; pointer-events: none; transform: scale(.8); transition: opacity 250ms, transform 400ms var(--rebote); }
#campo.abierto { opacity: 1; pointer-events: auto; transform: none; }
#campo:focus-visible { outline: 3px solid var(--acento); }
.escribiendo #estado { visibility: hidden; }   /* el campo ocupa su hueco mientras escribes */
.carta.respira { animation: respira 3.2s ease-in-out infinite alternate; }
@keyframes respira { to { translate: 0 -4px; } }


/* Barrido del cambio: un golpe anguloso */
#barrido { position: absolute; inset: -10%; z-index: 30; pointer-events: none; background: var(--tinta); clip-path: polygon(-30% 0, -10% 0, -40% 100%, -60% 100%); }
#barrido::after { content: ""; position: absolute; inset: 0; background: var(--acento); clip-path: polygon(0 0, 3% 0, 1% 100%, -2% 100%); }
#barrido.pasa { animation: barre 560ms var(--golpe); }
@keyframes barre {
    0% { clip-path: polygon(-30% 0, -10% 0, -40% 100%, -60% 100%); }
    48% { clip-path: polygon(-10% 0, 75% 0, 45% 100%, -40% 100%); }
    100% { clip-path: polygon(120% 0, 140% 0, 110% 100%, 90% 100%); }
}

/* ── Cartas-botón ─────────────────────────────────────────────────────────── */
/* La forma (fondo, borde y corte) va en ::before: así la carta puede llevar sombra dura
   (drop-shadow sigue el corte). Cada variante solo cambia --fondo, --linea, --corte y --sombra. */
.carta {
    --x: 0px; --y: 0px; --r: 0deg; --s: 1;
    --fondo: var(--tinta); --linea: inset 0 0 0 2px rgb(169 182 137 / 35%); --corte: polygon(4% 2%, 100% 0, 96% 98%, 0 100%);
    --sombra: drop-shadow(5px 6px 0 rgb(0 0 0 / 62%));
    position: absolute; left: 0; top: 0; width: var(--cw); height: var(--ch);
    transform: translate(var(--x), var(--y)) rotate(var(--r)) scale(var(--s));
    transition: transform 520ms var(--rebote), width 520ms cubic-bezier(.2,.8,.2,1), height 520ms cubic-bezier(.2,.8,.2,1),
        padding 520ms, color 200ms, opacity 300ms, filter 300ms;
    background: none; color: var(--texto); filter: var(--sombra);
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 14px 14px 12px; border: none; font: inherit; text-align: left; cursor: pointer;
    will-change: transform;
}
.carta::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--fondo); box-shadow: var(--linea); clip-path: var(--corte);
    transition: background 200ms, box-shadow 200ms, clip-path 520ms; }
.carta .palo { font: 900 1.1rem/1 var(--sans); color: var(--salvia); letter-spacing: .04em; }
.carta .nombre { font: 900 1.28rem/1.02 var(--sans); letter-spacing: -.01em; text-transform: uppercase; hyphens: auto; overflow-wrap: anywhere; }
.carta .nota { font: 600 .72rem/1.25 var(--sans); color: var(--tenue); }
.carta.elegida { --fondo: var(--acento); --linea: inset 0 0 0 3px var(--tinta); --sombra: drop-shadow(7px 8px 0 var(--tinta)); color: var(--sobreAcento); }
.carta.elegida .palo, .carta.elegida .nota { color: var(--sobreAcento); opacity: .78; }
.carta:focus-visible { outline: none; --linea: inset 0 0 0 4px var(--hueso); }
/* La carta jugada se vuelve el rectángulo del nombre (mismo sitio, tamaño y corte) */
.carta.cabecera {
    --ch: 40px; z-index: 12; cursor: default; justify-content: center; padding: 8px 12px;
    --cw: var(--cabw);
    --fondo: var(--acento); --linea: inset 0 0 0 2px var(--tinta); --corte: polygon(0 6%, 100% 0, 97% 100%, 2% 94%);
    --sombra: drop-shadow(4px 5px 0 var(--tinta)); color: var(--sobreAcento);
}
/* Las jugadas de antes asoman detrás de la de ahora: el camino, sin repetirlo abajo */
.carta.cabecera.previa { --sombra: brightness(.42) saturate(.7); }
.carta.cabecera .palo, .carta.cabecera .nota { display: none; }
.carta.cabecera .nombre { font-size: 1.15rem; font-weight: 800; text-transform: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.carta.jugador { --fondo: var(--hueso); --linea: inset 0 0 0 3px var(--tinta); color: var(--tinta); cursor: default; }
.carta.jugador .palo { color: var(--militar); }
.carta.jugador.listo { --fondo: var(--salvia); }
/* Tú, en la sala: contorno y sombra en bermellón (lo mismo que tu figura en la mesa) */
.carta.jugador.tuya { --linea: inset 0 0 0 4px var(--acento); --sombra: drop-shadow(5px 6px 0 var(--acento)); }
.carta.jugador.tuya .palo { color: var(--acento); }
.carta.dorso { --fondo: var(--militar); --linea: inset 0 0 0 5px var(--tinta), inset 0 0 0 6px var(--salvia); }
.carta.dorso > * { display: none; }

/* La pila del centro (de donde salen los menús) */
/* Al empezar la partida, la mesa de fondo es la protagonista hasta que se reparte */
[data-p="partida"]:not(.repartido) .carta.jugador { opacity: 0; }
[data-p="qr"] .carta.jugador, [data-p="cuenta"] .carta.jugador { opacity: 0; }

/* Textos sueltos: título pequeño y pista de uso */
/* Rejilla (la misma en todas las pantallas; los números salen de `rejilla()` en el JS):
   margen 16 · separación 8 · fila 1 (y 16): título · fila 2 (y 64, alto 40): cabecera o nombre a la
   izquierda, botones pequeños a la derecha · zona de piezas desde y 120 · abajo, de abajo arriba:
   pista, mano, rótulos del nivel, estado. Lo claro lleva borde oscuro y el texto suelto, fondo oscuro. */
:root { --cabw: min(190px, calc(100vw - 202px)); }
#titulo { position: absolute; left: 16px; top: 16px; font: 900 1.6rem/1 var(--sans); letter-spacing: -.02em; color: var(--hueso); transform: skewX(-10deg); transition: opacity 400ms; z-index: 10; }
#titulo span { color: var(--acento); }
#nombre { position: absolute; left: 16px; top: 64px; height: 40px; z-index: 12; font: 800 1.15rem var(--sans); color: var(--tinta); background: var(--hueso); border: none; padding: 8px 12px; width: var(--cabw); box-shadow: inset 0 0 0 2px var(--tinta); clip-path: polygon(0 6%, 100% 0, 97% 100%, 2% 94%); transition: opacity 300ms, transform 500ms var(--rebote); }
#nombre:focus-visible { outline: 3px solid var(--acento); }
[data-p]:not([data-p="inicio"]) #nombre { opacity: 0; pointer-events: none; transform: translateX(-40px); }
#estado { position: absolute; left: 50%; translate: -50% 0; width: max-content; max-width: calc(100vw - 32px); text-align: center; z-index: 12; font: 900 .95rem/1.25 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--hueso); background: rgb(6 6 6 / 82%); padding: 4px 10px; }
#estado:empty { display: none; }

/* ── Piezas: tres figuras angulosas que se transforman en lo que cada pantalla necesita ──
   (chat, código de la sala, número de jugadores, dificultad, diales de Elo, idioma…).
   Cambian de sitio, tamaño y corte con la misma curva que el fondo: se ve que es la misma
   pieza que pasa a hacer otra cosa. */
.pieza {
    position: absolute; z-index: 13; left: 0; top: 0; width: 0; height: 0; overflow: hidden;
    color: var(--texto); font: 800 .8rem var(--sans);
    filter: drop-shadow(4px 5px 0 rgb(0 0 0 / 62%));   /* sombra dura; la forma va en ::before */
    transition: left 620ms var(--golpe), top 620ms var(--golpe), width 620ms var(--golpe), height 620ms var(--golpe), opacity 300ms;
}
.pieza::before { content: ""; position: absolute; inset: 0; background: rgb(6 6 6 / 84%); box-shadow: inset 0 0 0 2px rgb(169 182 137 / 45%);
    clip-path: polygon(6px 0, 100% 4px, calc(100% - 6px) 100%, 0 calc(100% - 4px));   /* en px: el corte no come texto en piezas anchas */
    transition: clip-path 620ms var(--golpe); }
.pieza.oculta { opacity: 0; pointer-events: none; }
.pieza.oculta::before { clip-path: polygon(50% 50%, 50% 50%, 50% 50%, 50% 50%); }
.pieza > .dentro { position: absolute; inset: 0; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; animation: aparece 380ms 200ms both; }
@keyframes aparece { from { opacity: 0; translate: 0 6px; } }
.pieza .rotulo { font: 900 .66rem var(--sans); letter-spacing: .14em; color: var(--salvia); text-transform: uppercase; }
.pieza button { font: 900 .85rem var(--sans); color: var(--texto); background: none; border: none; cursor: pointer; padding: 6px 8px; }
.pieza .fila { display: flex; gap: 4px; align-items: center; justify-content: center; flex: 1; }
/* Opciones contiguas: el resalte se desliza de la que estaba a la nueva (no salta) */
.pieza .segs { position: relative; align-items: stretch; }
.pieza .seg { flex: 1; position: relative; z-index: 1; background: none; box-shadow: inset 0 0 0 1px rgb(169 182 137 / 40%); transform: skewX(-10deg); transition: color 160ms 120ms; }
.pieza .seg.si { color: var(--tinta); }
.pieza .resalte { position: absolute; top: 0; bottom: 0; z-index: 0; background: var(--acento); transform: skewX(-10deg);
    left: calc(var(--i) * (100% + 4px) / var(--n)); width: calc((100% - (var(--n) - 1) * 4px) / var(--n));
    transition: left 420ms var(--golpe); }
.pieza .num { font: 900 1.6rem var(--sans); min-width: 2ch; text-align: center; color: var(--hueso); }
/* Tambor de números (como los diales de Elo): se ve el de antes y el de después; gira al cambiar */
.pieza .tambor { --lin: 30px; position: relative; height: calc(var(--lin) * 3); width: 64px; overflow: hidden; cursor: ns-resize; touch-action: none;
    background: var(--tinta); box-shadow: inset 0 0 0 1px rgb(169 182 137 / 40%);
    mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent); -webkit-mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent); }
.pieza .tambor::after { content: ""; position: absolute; left: 0; right: 0; top: var(--lin); height: var(--lin); box-shadow: inset 0 2px 0 var(--acento), inset 0 -2px 0 var(--acento); pointer-events: none; }
.pieza .rodillo { display: flex; flex-direction: column; transform: translateY(calc((1 - var(--v) + var(--min)) * var(--lin))); transition: transform 460ms var(--rebote); }
.pieza .rodillo span { height: var(--lin); line-height: var(--lin); text-align: center; font: 900 1.5rem var(--sans); color: var(--tenue); font-variant-numeric: tabular-nums; }
.pieza .rodillo span.ya { color: var(--hueso); }
/* Iconos: trazos rectos de 2,5 px, del color del texto (nada de emoji) */
.pieza .fila > button > .ico { width: 1.6em; height: 1.6em; }
.ico { width: 1.15em; height: 1.15em; vertical-align: -.2em; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: square; stroke-linejoin: miter; }
.pieza .grande { flex: 1; display: grid; place-items: center; font: 900 1.05rem var(--sans); letter-spacing: .1em; color: var(--hueso); }
/* El chat: siempre en la sala, en una caja oscurecida para que los mensajes se lean */
.pieza .log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; justify-content: flex-end; gap: 3px; font: 600 .82rem/1.3 var(--sans); }
.pieza .log b { color: var(--salvia); font-weight: 900; }
.pieza .log .sis { color: var(--tenue); font-style: italic; }
.pieza .escribe { text-align: left; color: var(--tenue); background: rgb(255 255 255 / 6%); font-weight: 600; }
/* Los diales (agapornis-ui): grandes en el perfil, pequeños flotando sobre la mesa */
.pieza .diales { flex: 1; display: flex; gap: 18px; align-items: center; justify-content: center; --ag-dial-size: 26px; }
.dialMesa { position: absolute; left: 0; top: 0; z-index: 0; pointer-events: none; transform-origin: 50% 100%; --ag-dial-size: 15px; transition: opacity 300ms; }
.dialMesa .ag-dial-delta, .dialMesa .ag-dial-rank { display: none !important; }
/* Tu dial: una punta bermellón debajo, apuntando a tu figura */
.dialMesa.tuyo::after { content: ""; position: absolute; left: 50%; bottom: -12px; width: 14px; height: 9px; translate: -50% 0;
    background: var(--acento); clip-path: polygon(0 0, 100% 0, 50% 100%); filter: drop-shadow(2px 2px 0 #000); }
.pieza .log b.tuyo { color: var(--acento); }
.dialMesa .ag-dial-label { font-size: 9px; text-shadow: 0 0 3px #000, 0 0 2px #000; }
:root { --space-2: 6px; --font-sans: var(--sans); --font-mono: "Geist Mono", ui-monospace, Consolas, monospace; --radius-panel: 8px; --radius-ctl: 4px; --radius-pill: 999px;
    --text-muted: #a9a9ae; --accent: #a9b689; --accent-soft: rgb(169 182 137 / 18%); --accent-line: rgb(169 182 137 / 38%); --danger: #f87171;
    --card: #0e0e0e; --border-strong: rgb(255 255 255 / 18%); --dur-enter: 500ms; --ease-expo: cubic-bezier(0.16, 1, 0.3, 1); }
@keyframes ag-settle { from { opacity: 0; transform: translateY(4px) scale(.96); } }
/* agapornis-ui: dial.css y rank.css, tal cual */
__AGA_CSS__

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 1ms !important; animation-duration: 1ms !important; }
}
</style>
</head>
<body>
<div id="escenario" data-p="inicio">
    <div class="frag f1"></div><div class="frag f2"></div><div class="frag f3"></div>
    <canvas id="juego" aria-hidden="true"></canvas>

<script>

const escena = (() => {

    const DIS = { x: -0.86, z: 0.66 };   // cerca del borde, entre los dos: se alcanza sin estirar de más
    const CAMS = {   // yaw/pitch/roll en rad, distancia, centro en pantalla (0..1), punto al que mira (mx, mz)
        inicio:  { yaw: 0.35, pitch: 0.62, dist: 3.3, cy: 0.42, roll: -0.10, mx: 0, mz: 0 },
        crear:   { yaw: 1.60, pitch: 0.18, dist: 2.3, cy: 0.40, roll: 0.22, mx: 0.3, mz: 0 },
        unirse:  { yaw: -1.25, pitch: 1.12, dist: 2.4, cy: 0.40, roll: -0.32, mx: -0.2, mz: 0.2 },
        // La disputa, de cerca y algo desde arriba (se ven las dos manos sobre la carta). cy lo ajusta

        sala:    { yaw: 2.25, pitch: 0.52, dist: 1.45, cy: 0.42, roll: 0.10, mx: DIS.x, mz: DIS.z, my: 0.12 },

        cuenta:     { yaw: 0, pitch: 1.5, dist: 2.3, cy: 0.36, roll: 0, mx: 0, mz: 0, my: 0 },

        // Mirar una partida: de pie, detrás de una silla

        idioma:     { yaw: -0.4, pitch: 1.30, dist: 2.6, cy: 0.40, roll: -0.40, mx: 0, mz: 0 },
        privacidad: { yaw: 2.0, pitch: 0.25, dist: 2.1, cy: 0.40, roll: -0.18, mx: -0.3, mz: 0 },

    let gana = -1, chispas = [], anillos = [], estalló = false;
    let nuestras = [];   // cartas del menú soltadas en el centro de la mesa (las 6 últimas)   // la victoria: desde cuándo, y sus partículas
    // Segundos de partida por segundo real. En el inicio (con el nombre) todos juegan rápido,
    // recogiendo y lanzando; desde la primera opción elegida, tiempo bala.
    const RAPIDO = 1.5, BALA = 0.3;
    let vel = RAPIDO, velMeta = RAPIDO, tv = 0;   // tv: reloj de los gestos sueltos, al mismo ritmo
    // Dónde está el cuerpo: en la disputa, los dos se echan hacia la carta
    function base(a, p) {

    let C, R, U, F, foco;

    const X = {

        visor: null,                          // el visor del escáner de QR: { video, t0 }
        listos: [false, false, false, false], // lámpara encendida sobre quien está listo
        ocupados: [true, true, true, true],   // sillas con alguien; las vacías se ven vacías
        llegada: [-9, -9, -9, -9],            // cuándo se sentó (parpadea al llegar, como un bot)
        nombres: null,                        // los de la sala; sin sala, el top global
        elo: null,                            // por asiento: { v, pool, top3 }; sin sala, el top global
        anclas: [{}, {}, {}, {}],             // dónde va el dial de Elo de cada asiento (px CSS)
        placa: null,                          // la placa de Session Manager en tu respaldo: { txt, ok }
        burla: -9,                            // cuándo hizo tu figura el gesto de burla
        voto: null,                           // votación para echar: { a, t0 }
        mesas: null,                          // otras salas, en la misma sala oscura
        cortado: false, apagon: 1,            // sin conexión (empieza apagado: «Conectando…»)
        tu: -1,                               // tu asiento (contorno bermellón); -1 = no estás en la mesa
        marca: -1,                            // asiento señalado (a quién votas echar): también en bermellón
    };
    let principal = true, quietos = false;   // quietos: sala en espera, nadie lanza
    const RANGOS = {
        fun: [['Cartón', '#b89a6e'], ['Juguete', '#ffd23f'], ['Latón', '#d9c35a'], ['Caucho', '#8a8a8a'], ['Plástico', '#4fe3d3'],
            ['Gominola', '#ff8ab8'], ['Dulce', '#ff6b7a'], ['Confeti', '#b794ff'], ['Payaso', '#ff7a70']],
        glory: [['Hierro oxidado', '#b06a38'], ['Bronce', '#d9914d'], ['Plata', '#cdd5df'], ['Oro', '#f2cb5c'], ['Platino', '#bfe3ff'],
            ['Diamante', '#8fc0ff'], ['Máster', '#ffe27a'], ['Gran máster', '#ffb8d2'], ['Top 3 global', '#ffe08a']],

    const MINS = [null, 1001, 1100, 1200, 1300, 1400, 1500, 1600];   // los de agapornis-ui/rank.js
    function rango(v, pool, top3 = false) {
        let i = 0; for (let k = 1; k < MINS.length; k++) if (v >= MINS[k]) i = k;
        if (top3 && v >= 1600) i = 8;

    }
    // ponytail: Elo de ejemplo del top global; en Piles vendrá del mismo endpoint que los nombres
    const ELO_TOP = [{ v: 1724, pool: 'glory', top3: true }, { v: 1688, pool: 'glory', top3: true }, { v: 1651, pool: 'glory', top3: true }, { v: 1604, pool: 'glory' }];
    X.elo = ELO_TOP.map(e => ({ ...e }));

    // Polígono en 3D (lista de puntos), relleno y borde
    function poli(pts, relleno, borde, ancho = 1.2) {
        const p = pts.map(q => proy(q[0], q[1], q[2]));
        if (p.some(q => q[2] < 0.08)) return;
        g.beginPath(); p.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath();
        if (relleno) { g.fillStyle = relleno; g.fill(); }
        if (borde) { g.strokeStyle = borde; g.lineWidth = ancho * devicePixelRatio; g.stroke(); }
    }
    // Dibuja en un plano del mundo: origen o, ejes ex y ey (vectores 3D de largo ancho y alto);
    // fn pinta en coordenadas locales de ancho×alto px.
    function enPlano(o, ex, ey, ancho, alto, fn) {
        const P = proy(...o), A = proy(o[0] + ex[0], o[1] + ex[1], o[2] + ex[2]), B = proy(o[0] + ey[0], o[1] + ey[1], o[2] + ey[2]);
        if (P[2] < 0.1 || A[2] < 0.1 || B[2] < 0.1) return;
        g.save();
        g.transform((A[0] - P[0]) / ancho, (A[1] - P[1]) / ancho, (B[0] - P[0]) / alto, (B[1] - P[1]) / alto, P[0], P[1]);

        g.restore();
    }

    // La silla, con las medidas de la de las figuras (siluetas.py, ×1,5): asiento a −0,45,
    // respaldo de −0,39 a 0,57, 0,43 por detrás del centro del cuerpo
    function silla(a, p, alfa = 1) {
        const cu = base(a, p), { fw, ld } = ejes(a);

        g.globalAlpha = alfa;
        for (const [f, l] of [[0.18, 0.3], [0.18, -0.3], [-0.42, 0.3], [-0.42, -0.3]]) poli([P(f, l, -1.18), P(f, l, -0.45), P(f + 0.02, l, -0.45), P(f + 0.02, l, -1.18)], '#141610', 'rgba(169,182,137,0.35)');

                g.strokeStyle = '#a9b689'; g.lineWidth = 6; g.strokeRect(3, 3, 394, 174);
                for (const [x, y] of [[18, 18], [382, 18], [18, 162], [382, 162]]) { g.beginPath(); g.arc(x, y, 6, 0, 7); g.fillStyle = ok ? '#4b5320' : '#a9b689'; g.fill(); }
                g.fillStyle = ok ? '#0b0c09' : '#a9b689'; g.textAlign = 'center';

                g.font = '900 54px Geist, monospace'; g.fillText(X.placa.txt || '· · · · · ·', 200, 118);
                g.font = '700 24px Geist, sans-serif'; g.fillText(T(ok ? '✓ VINCULADO' : 'pega tu código'), 200, 158);
            });

    }
    // Lámpara colgada sobre quien está listo, y su luz en la mesa
    function lampara(a, p) {
        if (!X.listos[p] || cam.pitch > 1.2) return;
        const { fw } = ejes(a), cu = base(a, p);
        const L = proy(cu.x + fw[0] * 0.5, 1.45, cu.z + fw[1] * 0.5), cuerda = proy(cu.x + fw[0] * 0.5, 3, cu.z + fw[1] * 0.5);

        const rr = 1.1 * foco / suelo[2], lu = g.createRadialGradient(suelo[0], suelo[1], 0, suelo[0], suelo[1], rr);

        g.beginPath(); g.moveTo(cuerda[0], cuerda[1]); g.lineTo(L[0], L[1]); g.stroke();
        const sh = 0.09 * foco / L[2];

    }
    // Mosaico: cartas que vuelan del centro y forman una figura vista desde arriba
    function mosaico() {
        const M = X.mosaico; if (!M) return;
        if (M.salen && reloj > M.salen + 0.5) { X.mosaico = null; return; }
        const s = M.s;
        for (const [i, k] of M.celdas.entries()) {
            const dl = Math.hypot(k.x, k.z) * 0.5 + (i % 7) * 0.012, u = suave(M.t0 + dl, M.t0 + dl + 0.55, reloj);
            if (u <= 0) continue;
            const sale = M.salen ? suave(M.salen, M.salen + 0.4, reloj) : 0;
            const x = lerp(0, k.x, u) * (1 + sale * 2), z = lerp(0, k.z, u) * (1 + sale * 2);
            const lado = !M.huecos && !k.c ? s * 0.52 : s * 0.47;   // QR: las claras se solapan, sin rendijas oscuras
            quad(x, 0.02 + Math.sin(u * Math.PI) * 0.3, z, lado, lado, (1 - u) * (3 + i % 5), M.huecos ? ROJO : k.c ? '#0e0e0e' : '#e9e6da', M.huecos ? '#0e0e0e' : null);   // la cuenta atrás, en bermellón
        }
    }
    // Visor del escáner: cuatro esquinas de cartas y lo que ve la cámara en el centro
    function visor() {
        const V = X.visor; if (!V) return;
        const h = 0.42;
        const P = [[-h, -h], [h, -h], [h, h], [-h, h]].map(([x, z]) => proy(x, 0.02, z));
        if (V.video?.readyState >= 2) {
            const xs = P.map(q => q[0]), ys = P.map(q => q[1]);
            g.save(); g.beginPath(); P.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.clip();
            g.globalAlpha = 0.9; g.drawImage(V.video, Math.min(...xs), Math.min(...ys), Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys));
            g.restore();
        }
        for (const [sx, sz] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {   // esquinas en L de tres cartas
            quad(sx * h, 0.03, sz * h, 0.05, 0.05, 0, '#a9b689', '#0e0e0e');
            quad(sx * (h - 0.1), 0.03, sz * h, 0.05, 0.03, 0, '#a9b689', '#0e0e0e');
            quad(sx * h, 0.03, sz * (h - 0.1), 0.03, 0.05, 0, '#a9b689', '#0e0e0e');
        }
        const zz = -h + ((reloj - V.t0) * 0.5 % 1) * 2 * h, a = proy(-h, 0.03, zz), b = proy(h, 0.03, zz);
        g.strokeStyle = 'rgba(169,182,137,0.9)'; g.lineWidth = 3 * devicePixelRatio; g.shadowColor = '#a9b689'; g.shadowBlur = 14;
        g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); g.shadowBlur = 0;
    }
    // Votos para echar: cada uno lanza una carta hacia el señalado
    function votos() {
        const V = X.voto; if (!V) return;
        const obj = ASIENTOS[V.a];
        ASIENTOS.forEach((a, p) => {
            if (p === V.a || !X.ocupados[p]) return;
            const u = suave(V.t0 + p * 0.35, V.t0 + p * 0.35 + 0.5, reloj);
            if (u <= 0) return;
            const x = lerp(a.x * 0.6, obj.x * 0.62 + p * 0.04, u), z = lerp(a.z * 0.6, obj.z * 0.62 - p * 0.03, u);
            quad(x, 0.03 + Math.sin(u * Math.PI) * 0.15, z, CW_M, CH_M, u * 6 + p, '#a9b689', '#0e0e0e');
        });
    }

    function unaMesa(e) {
        // Quien queda detrás del centro se dibuja antes que la mesa: la mesa le tapa las piernas
        const dc = proy(0, 0, 0)[2];
        const gente = ASIENTOS.map((a, p) => estadoDe(a, p)).sort((x, y) => y.d - x.d);
        for (const q of gente) if (q.d > dc) figura(q, e);
        // Mesa maciza: canto de 9 cm (de lado se ve que tiene grosor) y tablero opaco con luz de lámpara
        const c0 = proy(0, 0, 0), GR = 0.09;
        const aro = (y, i) => { const a = i / 64 * Math.PI * 2; return proy(Math.cos(a) * 1.7, y, Math.sin(a) * 1.2); };
        if (cam.pitch < 1.3) {
            g.beginPath();
            for (let i = 0; i <= 64; i++) { const [x, y] = aro(0, i); i ? g.lineTo(x, y) : g.moveTo(x, y); }
            for (let i = 64; i >= 0; i--) { const [x, y] = aro(-GR, i); g.lineTo(x, y); }
            g.fillStyle = '#070806'; g.fill();
            g.beginPath();
            for (let i = 0; i <= 64; i++) { const [x, y] = aro(-GR, i); i ? g.lineTo(x, y) : g.moveTo(x, y); }
            g.strokeStyle = 'rgba(0, 0, 0, 0.9)'; g.lineWidth = 3 * devicePixelRatio; g.stroke();
        }
        const grad = g.createRadialGradient(c0[0], c0[1], 0, c0[0], c0[1], cv.height * 0.5);
        grad.addColorStop(0, '#2b3121'); grad.addColorStop(0.6, '#181c13'); grad.addColorStop(1, '#10120d');
        g.beginPath();
        for (let i = 0; i <= 64; i++) { const [x, y] = aro(0, i); i ? g.lineTo(x, y) : g.moveTo(x, y); }
        g.fillStyle = grad; g.fill();
        g.strokeStyle = 'rgba(169, 182, 137, 0.55)'; g.lineWidth = 2 * devicePixelRatio; g.stroke();

        // Centro: 4 a 6 cartas boca arriba, esparcidas (cuántas, según la altura de la partida)
        let n = 5;
        for (const a of ACC) { if (a.t > t) break; n += a.toma ? -1 : 1; n = Math.max(4, Math.min(6, n)); }
        for (let i = 0; i < n; i++) {
            const an = i / n * Math.PI * 2 + 0.4, r = i % 2 ? 0.36 : 0.24;
            quad(Math.cos(an) * r, 0.004, Math.sin(an) * r * 0.8, CW_M, CH_M, an * 1.7, '#e9e6da', '#4b5320');
        }
        // Y las nuestras: las cartas del menú que caen al centro, encima de las demás
        if (principal) for (const q of nuestras) quad(q.x, 0.012, q.z, CW_M, CH_M, q.rot, q.dorso ? '#4b5320' : '#0e0e0e', '#a9b689');
        // Delante de cada jugador, sus 6 sets de 4 cartas boca abajo; el que mira, en salvia
        for (const [p, a] of ASIENTOS.entries()) {
            const m = Math.hypot(a.x, a.z), tg = [-a.z / m, a.x / m];
            const actual = Math.floor(t / 7 + p * 2) % 6;
            for (let j = 0; j < 6; j++) {
                const o = (j - 2.5) * 0.19, x = a.x * 0.66 + tg[0] * o, z = a.z * 0.66 + tg[1] * o;
                for (let c = 0; c < 4; c++) quad(x, 0.004 + c * 0.008, z, 0.04, 0.056, a.a + Math.PI / 2 + (c - 1.5) * 0.06, j === actual && c === 3 ? '#a9b689' : '#4b5320', 'rgba(14,14,14,0.9)');
            }
        }

        if (principal) {
            // Dónde va el dial de Elo de cada uno: delante de su pecho, casi pegado a la mesa
            ASIENTOS.forEach((a, p) => {
                const cu = base(a, p), { fw } = ejes(a), q = proy(cu.x + fw[0] * 0.55, 0.12, cu.z + fw[1] * 0.55);
                X.anclas[p] = { x: q[0] / devicePixelRatio, y: q[1] / devicePixelRatio, s: Math.min(1.0, Math.max(0.35, 2.0 / q[2])),
                    ok: q[2] > 0.4 && cam.pitch < 1.2 && X.ocupados[p] && X.apagon < 0.5 };
            });
            mosaico(); visor(); votos();
        }
        ASIENTOS.forEach((a, p) => lampara(a, p));
        // Quien queda delante; luego las cartas en sus manos o en vuelo, encima de todo
        for (const q of gente) if (q.d <= dc) figura(q, e);
        for (const c of enMano) quad(c.x, c.y, c.z, CW_M, CH_M, c.rot, '#4b5320', '#a9b689');
        enMano.length = 0;
        if (principal && disputa > 0.01 && X.ocupados[1] && cam.pitch < 1.2) pelea(disputa, e);
    }

    // ¿Está jugando ahora? (la jugada más cercana de esta persona en la línea de tiempo)
    // Lanza la carta como una apuesta de póker. Columnas de la hoja: 0-5 la recoge junto al
    // pecho (lento), 6-11 golpe de muñeca (acelera hasta soltarla en ac.t), 20-23 vuelve directo
    // al reposo. La carta sale de entre sus dedos y vuela sola, girando, al centro.
    function estadoDe(a, p) {
        let col = -1, carta = null;   // carta: { en mano } o { vuela: u, giro }
        if (!quietos && !(p < 2 && disputa > 0.05)) for (const ac of ACC) {   // en la disputa, los dos no lanzan
            if (ac.p !== p || t < ac.t - 0.9 || t > ac.t + 0.8) continue;
            if (t < ac.t) {
                const s = (t - (ac.t - 0.9)) / 0.9;
                col = s < 0.6 ? Math.round(5 * suave(0, 1, s / 0.6)) : 6 + Math.round(5 * ((s - 0.6) / 0.4) ** 2);
                carta = { mano: true };
            } else {
                const r = (t - ac.t) / 0.8;
                col = r < 0.12 ? 11 : 20 + Math.min(3, Math.floor((r - 0.12) / 0.88 * 4));
                if (t < ac.t + 0.6) carta = { vuela: suave(ac.t, ac.t + 0.6, t), giro: ac.giro };
            }
        }
        return { a, p, col, carta, d: proy(a.x, 0.6, a.z)[2] };
    }
    function figura(q, e) {
        // El 0 gana: alza la carta. El 1 se queda en reposo, echado hacia la carta.
        const victoria = q.p === 0 && e >= 0 ? suave(0.12, 0.8, e) : -1;
        // Vista desde arriba (QR, cuenta atrás): las figuras son recortes, se desvanecen
        const arriba = 1 - suave(1.0, 1.3, cam.pitch);
        if (arriba < 0.02) return;
        g.globalAlpha = arriba;
        if (!X.ocupados[q.p]) silla(q.a, q.p, arriba);
        else {
            // Recién sentado (bot): parpadea medio segundo
            if (reloj - X.llegada[q.p] < 0.6 && Math.random() < 0.5) { g.globalAlpha = 1; return; }
            silueta(q.a, q.p, q.col, victoria, q.carta);
            if (principal) deLaSilla(q.a, q.p);   // encima: la placa del respaldo y la medalla
        }
        g.globalAlpha = 1;
    }

    // Partículas en pantalla: chispas con estela, anillos de onda
    function particulas(dt) {
        g.save();
        g.globalCompositeOperation = 'lighter';
        g.lineCap = 'round';
        chispas = chispas.filter(c => (c.vida -= dt) > 0);
        for (const c of chispas) {
            c.vy += 900 * devicePixelRatio * dt * c.peso;
            c.x += c.vx * dt; c.y += c.vy * dt;
            c.vx *= 1 - 1.8 * dt; c.vy *= 1 - 1.8 * dt;
            const k = c.vida / c.total;
            g.strokeStyle = c.color.replace('A', (0.9 * k).toFixed(2));
            g.lineWidth = c.ancho * (0.4 + k);
            g.beginPath(); g.moveTo(c.x, c.y); g.lineTo(c.x - c.vx * 0.045, c.y - c.vy * 0.045); g.stroke();
        }
        anillos = anillos.filter(r => (r.vida -= dt) > 0);
        for (const r of anillos) {
            const k = 1 - r.vida / r.total;
            g.strokeStyle = `rgba(169, 182, 137, ${(1 - k) * 0.9})`;
            g.lineWidth = (10 - 8 * k) * devicePixelRatio;
            g.beginPath(); g.ellipse(r.x, r.y, r.radio * k, r.radio * k * 0.55, 0, 0, Math.PI * 2); g.stroke();
        }
        g.restore();
    }
    function chispa(x, y, fuerza, peso = 1) {
        const an = Math.random() * Math.PI * 2, v = fuerza * (0.3 + Math.random()) * devicePixelRatio;
        const vida = 0.4 + Math.random() * 0.7;
        chispas.push({ x, y, vx: Math.cos(an) * v, vy: Math.sin(an) * v - fuerza * 0.4 * devicePixelRatio, vida, total: vida, peso,
            ancho: (1.5 + Math.random() * 3) * devicePixelRatio,
            color: Math.random() < 0.45 ? 'rgba(232, 64, 42, A)' : Math.random() < 0.6 ? 'rgba(169, 182, 137, A)' : 'rgba(233, 230, 218, A)' });
    }

    // «¡A JUGAR!»: dos manos agarran la misma carta y tiran, cada una hacia su lado.
    // Al empezar la partida (e ≥ 0) la del asiento 0 la arranca y la alza, estilo duelo.
    function pelea(k, e) {
        const A = ASIENTOS[0], B = ASIENTOS[1];
        const ab = [B.x - A.x, B.z - A.z], nab = Math.hypot(...ab);
        let tira = Math.sin(reloj * 2.6) * 0.7 + Math.sin(reloj * 7.3) * 0.3;   // -1..1: quién gana ahora
        if (e >= 0) tira = lerp(tira, -1.6, suave(0, 0.15, e));                // tirón final hacia el 0
        const mesa = { x: DIS.x + ab[0] / nab * tira * 0.05, z: DIS.z + ab[1] / nab * tira * 0.05 };
        const vuelo = e >= 0 ? suave(0.15, 0.85, e) : 0;
        if (vuelo === 0) quad(mesa.x, 0.03, mesa.z, CW_M, CH_M, 0.5 + tira * 0.12, '#a9b689', '#0e0e0e');
        else cartaAlzada(mesa, A, vuelo, e);
        for (const S of [A, B]) {
            if (S === A && e > 0.15) continue;   // su brazo ya lo lleva la figura, alzado
            if (S === B && e >= 0) k = disputa * (1 - suave(0.12, 0.3, e));
            // El brazo del lado de la carta: hombro, codo abierto hacia fuera, mano sobre su borde
            const m = Math.hypot(S.x, S.z), u = [S.x / m, S.z / m], perp = [-u[1], u[0]];
            const lado = Math.sign((mesa.x - S.x) * perp[0] + (mesa.z - S.z) * perp[1]) || 1;
            const cu = base(S, S === A ? 0 : 1);
            const hom = { x: cu.x - u[0] * 0.05 + perp[0] * 0.2 * lado, y: 0.42, z: cu.z - u[1] * 0.05 + perp[1] * 0.2 * lado };
            const reposo = { x: S.x * 0.8 + perp[0] * 0.15 * lado, y: 0.06, z: S.z * 0.8 + perp[1] * 0.15 * lado };
            const fin = { x: mesa.x + u[0] * 0.1, y: 0.05, z: mesa.z + u[1] * 0.1 };
            const kk = suave(0, 0.3, k);   // la mano llega antes que el cuerpo se incline
            const mano = { x: lerp(reposo.x, fin.x, kk), y: lerp(reposo.y, fin.y, kk) + Math.sin(kk * Math.PI) * 0.15, z: lerp(reposo.z, fin.z, kk) };
            const tirando = (S === A ? -tira : tira) > 0.2;
            brazo(hom, mano, kk < 0.85 ? 0 : tirando ? 2 : 1, [perp[0] * lado, perp[1] * lado]);
        }
    }

    // Brazo prerenderizado del mismo cuerpo MPFB (brazos.py), palma abajo y dedos estirados.
    // Hoja de 3 columnas (0 llega, 1 aprieta la carta, 2 aprieta y tira) × 16 vistas:
    // 8 azimuts cada 45° (0 = desde delante de la mano, 90 = desde fuera) a 20° y a 55° de alzada.
    // Por celda: hombro, agarre y un punto hacia fuera del hombro, en píxeles de la celda.
    const BRZ = new Image(), BC = 256, PX_M = BC / 1.1;   // ortho_scale 1.1
    const ANC = [[[136.65,74.05,137.9,149.55,101.75,74.05],[136.65,74.05,143.1,159.6,101.75,74.05],[136.65,74.05,143.55,162.8,101.75,74.05]],[[69.1,81.15,159.05,143.75,44.4,89.6],[69.1,81.15,161.1,152.75,44.4,89.6],[69.1,81.15,160.75,155.95,44.4,89.6]],[[36.05,102.55,162.0,134.5,36.05,114.45],[36.05,102.55,159.75,143.55,36.05,114.45],[36.05,102.55,158.75,146.95,36.05,114.45]],[[56.85,125.65,145.05,127.3,81.55,134.1],[56.85,125.65,139.75,137.4,81.55,134.1],[56.85,125.65,138.75,141.1,81.55,134.1]],[[119.35,136.95,118.1,126.3,154.25,136.95],[119.35,136.95,112.9,137.9,154.25,136.95],[119.35,136.95,112.45,141.75,154.25,136.95]],[[186.9,129.8,96.95,132.1,211.6,121.35],[186.9,129.8,94.9,144.7,211.6,121.35],[186.9,129.8,95.25,148.6,211.6,121.35]],[[219.95,108.45,94.0,141.3,219.95,96.5],[219.95,108.45,96.25,153.9,219.95,96.5],[219.95,108.45,97.25,157.6,219.95,96.5]],[[199.15,85.35,110.95,148.5,174.45,76.9],[199.15,85.35,116.25,160.05,174.45,76.9],[199.15,85.35,117.25,163.5,174.45,76.9]],[[136.65,38.9,137.9,161.9,101.75,38.9],[136.65,38.9,143.1,166.65,101.75,38.9],[136.65,38.9,143.55,168.0,101.75,38.9]],[[69.1,56.0,159.05,148.0,44.4,76.2],[69.1,56.0,161.1,150.3,44.4,76.2],[69.1,56.0,160.75,151.65,44.4,76.2]],[[36.05,107.2,162.0,125.95,36.05,135.8],[36.05,107.2,159.75,128.3,36.05,135.8],[36.05,107.2,158.75,130.1,36.05,135.8]],[[56.85,162.5,145.05,108.6,81.55,182.75],[56.85,162.5,139.75,113.55,81.55,182.75],[56.85,162.5,138.75,116.0,81.55,182.75]],[[119.35,189.6,118.1,106.2,154.25,189.6],[119.35,189.6,112.9,114.65,154.25,189.6],[119.35,189.6,112.45,117.65,154.25,189.6]],[[186.9,172.55,96.95,120.1,211.6,152.3],[186.9,172.55,94.9,131.0,211.6,152.3],[186.9,172.55,95.25,134.0,211.6,152.3]],[[219.95,121.35,94.0,142.15,219.95,92.75],[219.95,121.35,96.25,153.0,219.95,92.75],[219.95,121.35,97.25,155.55,219.95,92.75]],[[199.15,66.0,110.95,159.45,174.45,45.75],[199.15,66.0,116.25,167.75,174.45,45.75],[199.15,66.0,117.25,169.65,174.45,45.75]]];
    BRZ.src = '__BRAZO__';
    // fuera: dirección (x, z) del cuerpo hacia ese hombro. Con ella se elige la vista y,
    // si el brazo es el izquierdo, se dibuja en espejo.
    function brazo(H, M, col, fuera) {
        if (!BRZ.complete) return;
        const S = proy(H.x, H.y, H.z), P = proy(M.x, M.y, M.z);
        if (S[2] < 0.15 || P[2] < 0.15) return;
        let fx = M.x - H.x, fz = M.z - H.z; const nf = Math.hypot(fx, fz) || 1; fx /= nf; fz /= nf;
        const cx = C[0] - (H.x + M.x) / 2, cy = C[1] - (H.y + M.y) / 2, cz = C[2] - (H.z + M.z) / 2;
        const fc = cx * fx + cz * fz, oc = cx * fuera[0] + cz * fuera[1];
        const az = ((Math.round(Math.atan2(oc, fc) / (Math.PI / 4)) % 8) + 8) % 8;
        const fila = (Math.atan2(cy, Math.hypot(fc, oc)) > 0.65 ? 8 : 0) + az;
        const [hx, hy, ax, ay, ox, oy] = ANC[fila][col];
        const sx = ax - hx, sy = ay - hy, dx = P[0] - S[0], dy = P[1] - S[1];
        // ¿El codo cae del mismo lado en pantalla que en la celda? Si no, es el otro brazo: espejo
        const O = proy(H.x + fuera[0] * 0.15, H.y, H.z + fuera[1] * 0.15);
        const lado = (a, b, c, d) => Math.sign(a * d - b * c);
        const espejo = lado(dx, dy, O[0] - S[0], O[1] - S[1]) !== lado(sx, sy, ox - hx, oy - hy);
        const largo = Math.hypot(dx, dy) / (Math.hypot(sx, sy) || 1);
        const ancho = foco / ((S[2] + P[2]) / 2) / PX_M;
        g.save();
        g.translate(S[0], S[1]);
        g.rotate(Math.atan2(dy, dx));
        g.scale(largo, espejo ? -ancho : ancho);   // a lo largo llega a la mano; de ancho, perspectiva
        g.rotate(-Math.atan2(sy, sx));
        g.drawImage(BRZ, col * BC, fila * BC, BC, BC, -hx, -hy, BC, BC);
        g.restore();
    }

    // La carta ganada: sale de la mesa girando, crece y queda en alto brillando
    function cartaAlzada(mesa, A, u, e) {
        const n = Math.hypot(A.x, A.z), fw = [-A.x / n, -A.z / n];
        const alto = { x: A.x * 0.98 + fw[0] * 0.33, y: 1.3, z: A.z * 0.98 + fw[1] * 0.33 };
        const pos = proy(lerp(mesa.x, alto.x, u), lerp(0.03, alto.y, u) + Math.sin(u * Math.PI) * 0.45, lerp(mesa.z, alto.z, u));
        if (pos[2] < 0.1) return;
        if (!estalló) {   // el arranque: estallido y onda
            estalló = true;
            for (let i = 0; i < 90; i++) chispa(pos[0], pos[1], 700, 0.6);
            anillos.push({ x: pos[0], y: pos[1], radio: cv.width * 0.6, vida: 0.6, total: 0.6 });
        }
        const h = 0.26 * foco / pos[2] * (1 + 0.7 * Math.sin(u * Math.PI)), w = h * 0.7;
        if (u < 1) for (let i = 0; i < 3; i++) chispa(pos[0], pos[1], 120, 0.2);   // estela
        g.save();
        g.translate(pos[0], pos[1]);

const ancho = () => W() >= 1024;   // columna del chat a la derecha; si no, todo apilado
function rejilla() {
    const w = W(), h = H(), es = h < 720 ? 0.8 : 1;   // mano más pequeña en pantallas bajas
    const manoTop = h - M - 176 * 1.08 * es;          // borde de arriba de la carta elegida
    return { w, h, es, manoTop, estadoAbajo: manoTop - SEP, libre: manoTop - SEP - ESTADO_H - SEP, cabw: Math.min(190, w - 202) };
}
let mano = [], sel = 0, pantalla = 'inicio', cabeceras = [], sala = null;

function hacerCarta(o, clase = '') {

    c.type = 'button';
    c.className = 'carta ' + clase;
    c.innerHTML = `<span class="palo"></span><span class="nombre"></span><span class="nota"></span>`;
    for (const k of ['palo', 'nombre', 'nota']) ponTexto(c, k, o[k] ?? '');
    return c;
}
/** Texto de una carta: se guarda en español y se muestra traducido (para cambiar de idioma). */
function ponTexto(c, k, es) { c.dataset[k] = es; pintaTexto(c, k); }

// Un palo «i:nombre» es un icono; el resto, texto traducido
function pintaTexto(c, k) {
    const es = c.dataset[k], e = c.querySelector('.' + k);
    if (es.startsWith('i:')) e.innerHTML = ico(es.slice(2)); else e.textContent = T(es);
}
// Iconos propios (sin emoji): líneas rectas, esquinas en punta, del color del texto
const ICONOS = {
    rayo: 'M13 2 5 14h6l-1 8 8-12h-6z', mas: 'M12 4v16M4 12h16', menos: 'M4 12h16', entrar: 'M6 18 18 6M8 6h10v10',
    enlace: 'M9 15l6-6M8 11l-3 3 5 5 3-3M16 13l3-3-5-5-3 3', bocina: 'M3 9v6h4l6 5V4L7 9zM16 9l2 3-2 3M19 6l3 6-3 6',

    copiar: 'M8 8h12v12H8zM4 16V4h12', silla: 'M7 3v18M7 12h10v9', volver: 'M9 5 4 10l5 5M4 10h12v9h-4',

    nota: 'M9 18V4l9 3M9 18H5v-4h4', vacio: 'M6 6h12v12H6zM4 20 20 4', play: 'M7 4v16l12-8z', ojo: 'M2 12l5-5h10l5 5-5 5H7zM11 10h2v4h-2z',
    check: 'M4 12l5 5L20 6', cambio: 'M4 8h15M15 4l4 4-4 4M20 16H5M9 12l-4 4 4 4', llenar: 'M4 6h12M4 12h16M4 18h12M16 8l4 4-4 4',

    qr: 'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2M18 14h2v2M14 18h2v2M18 18v2h2',
};
const ico = n => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONOS[n]}"/></svg>`;
const pon = (c, x, y, r = 0, s = 1) => { c.style.setProperty('--x', x + 'px'); c.style.setProperty('--y', y + 'px'); c.style.setProperty('--r', r + 'deg'); c.style.setProperty('--s', s); };
// El centro es el de la mesa de fondo: las cartas vuelan a donde se ve en pantalla.
const pilaX = () => escena.centro().x - 64, pilaY = () => escena.centro().y - 88, pilaS = () => escena.centro().s;
/** La carta cae al centro esparcido y se queda en la mesa de fondo, con las otras. */
function alCentro(c, dorso = false, retraso = 0) {
    const h = escena.soltar(dorso);
    c.classList.remove('respira', 'elegida', 'cabecera');
    c.style.transitionDelay = `${retraso}ms`;
    pon(c, h.x - 64, h.y - 88, Math.random() * 60 - 30, h.s);
    setTimeout(() => { h.poner(); c.style.transitionDelay = ''; c.style.opacity = '0'; }, 480 + retraso);
    setTimeout(() => c.remove(), 820 + retraso);
}

// La mano: en abanico horizontal sobre la mesa; la elegida, centrada y levantada.
function colocarMano(rapido = false, desliz = 0) {   // desliz: px que sigue al dedo (sin animar)
    const R = rejilla(), s0 = 1.08 * R.es, yE = R.manoTop - 88 + 88 * s0;   // la elegida toca manoTop
    if (ini?.eje === 'h') mano.forEach(c => (c.style.transition = 'none'));
    mano.forEach((c, i) => {
        const k = i - sel;
        const x = W() / 2 - 64 + k * 112 * R.es + desliz;
        const y = k === 0 ? yE : yE + Math.min(12, 4 + Math.abs(k) * 4);   // las de al lado no bajan de la elegida
        c.classList.toggle('elegida', k === 0);
        c.setAttribute('aria-selected', k === 0);
        c.tabIndex = k === 0 ? 0 : -1;
        if (rapido) c.style.transition = 'none';
        pon(c, x, y, k * 5, k === 0 ? s0 : .9 * R.es);
        if (rapido) { void c.offsetWidth; c.style.transition = ''; }
    });
    colocarTextos();
    alElegirCarta();
}
/** Rótulos del nivel, estado y campo: apilados sobre la mano (en la partida, el estado arriba). */
function colocarTextos() {
    const R = rejilla(), arriba = pantalla === 'partida';
    estado.style.top = arriba ? ZONA + 'px' : 'auto';
    estado.style.bottom = arriba ? 'auto' : (R.h - R.estadoAbajo) + 'px';
    campo.style.bottom = (R.h - R.estadoAbajo) + 'px';
}

// Repartir = cambiar de set: la mano nueva entra de lado (dir 1: desde la derecha, al
// avanzar; -1: desde la izquierda, al volver), como al pasar de un set a otro en Piles.
// Sin dir (la primera vez) sale de la pila.
function repartir(opciones, dir = 0) {
    mano.forEach(c => c.remove());
    mano = opciones.map((o, i) => {
        const c = hacerCarta(o);
        c.dataset.i = i;
        c.style.transition = 'none';
        if (dir) pon(c, W() / 2 - 64 + dir * (W() * 0.9 + i * 70), rejilla().manoTop, dir * 14, .9);
        else pon(c, pilaX(), pilaY(), -8, .7);
        zona.append(c);
        return c;
    });
    sel = 0;
    requestAnimationFrame(() => requestAnimationFrame(() => mano.forEach((c, i) => {
        c.style.transition = '';
        c.style.transitionDelay = `${i * 55}ms`;
        setTimeout(() => { c.style.transitionDelay = ''; c.classList.add('respira'); c.style.animationDelay = `${i * -0.7}s`; }, 650 + i * 55);
    })));
    requestAnimationFrame(() => requestAnimationFrame(() => colocarMano()));
}
/** Cabeceras: la de ahora en la fila 2; las dos de antes asoman detrás, más oscuras. */
function apilarCabeceras() {
    const n = cabeceras.length;
    cabeceras.forEach((h, i) => {
        const atras = n - 1 - i, k = Math.min(atras, 2);
        h.classList.toggle('previa', atras > 0);
        h.style.opacity = atras > 2 ? '0' : '';
        h.style.zIndex = 12 - k;
        pon(h, M - k * 5, FILA2 - k * 5, -k * 1.5, 1);
    });
}
/** La mano de ahora se tira al centro de la mesa (al cambiar de set). */
function retirarMano() {
    const viejas = mano; mano = [];
    viejas.forEach((x, i) => alCentro(x, false, i * 45));
}

function elegir(d) {
    const n = Math.max(0, Math.min(mano.length - 1, sel + d));
    if (n === sel) {   // en el borde: rebote
        mano[sel]?.animate([{ translate: '0 0' }, { translate: `${-d * 14}px 0` }, { translate: '0 0' }], { duration: 320, easing: 'cubic-bezier(.34,1.56,.64,1)' });
        return;
    }
    sel = n; vibrar(6); colocarMano();
}

// Jugar la carta elegida: vuela directa arriba, en bermellón, y se queda como cabecera.
function jugar() {
    const c = mano[sel]; if (!c) return;
    const o = MENUS[pantalla][sel];
    if (o.accion !== undefined) { accion(o.accion, c, o); return; }
    vibrar(18);
    c.classList.remove('respira');
    c.style.transition = '';
    mano.splice(sel, 1);
    cambiar(o.ir, c, o);
}

function cambiar(destino, jugada, o) {
    const b = document.getElementById('barrido');
    b.classList.remove('pasa'); void b.offsetWidth; b.classList.add('pasa');
    // La jugada se transforma en el título, arriba; las de antes quedan asomando detrás.
    jugada.classList.remove('elegida');
    jugada.classList.add('cabecera');
    jugada.disabled = true;
    cabeceras.push(jugada);
    apilarCabeceras();
    historial.push(pantalla);
    const antes = pantalla;
    pantalla = destino;
    esc.dataset.p = destino;
    preparaMenu(destino, o);
    estado.textContent = '';
    cerrarCampo();
    if (destino === 'sala' && !sala) entrarSala({ ...o, jug: o.jug ?? crearJug });
    escena.ir(destino, historial.length);
    alCambiar(antes, destino);
    retirarMano();                       // el resto del set, al centro (con la cámara nueva)
    setTimeout(() => repartir(MENUS[destino], 1), 160);
}

// ↓ = volver: la última cabecera vuelve a la pila y se reparte el menú anterior.
const historial = [];
function volver() {
    if (pantalla === 'cuenta') { cancelarCuenta('Alguien ya no está listo'); return; }
    if (pantalla === 'oferta') { cerrarOferta(); return; }
    if (!historial.length || pantalla === 'partida') return;
    const antes = pantalla;
    // El título vuelve a ser carta y cae al centro; el anterior regresa a su sitio.
    const h = cabeceras.pop();
    h.classList.remove('previa');
    apilarCabeceras();
    if (pantalla === 'sala') salirSala();   // desde «bots» se vuelve a la sala, sin salir
    cerrarCampo();
    const b = document.getElementById('barrido');
    b.classList.remove('pasa'); void b.offsetWidth; b.classList.add('pasa');
    pantalla = historial.pop();
    esc.dataset.p = pantalla;
    estado.textContent = '';
    escena.ir(pantalla, historial.length);
    alCambiar(antes, pantalla);
    alCentro(h);
    retirarMano();
    setTimeout(() => repartir(MENUS[pantalla], -1), 120);
}

// ── Sala: cada jugador que se conecta es una carta que cae sobre la mesa ──────
// Filas de 4 centradas desde ZONA (escala .56 = 72×99 px; cada 80 px de lado y 107 de alto).
const filasSala = () => Math.ceil((sala?.max ?? 4) / 4);
function posJugador(i, max) {
    const fila = Math.floor(i / 4), enFila = Math.min(4, max - fila * 4), k = i % 4;
    return [W() / 2 - 64 + (k - (enFila - 1) / 2) * 80, ZONA - 39 + 4 + fila * 107];   // +4: el giro de ±3° no toca la fila 2
}
function entrarSala(o) {
    const max = o.jug ?? 4;
    chatLog.length = 0;
    sala = { max, cartas: [], gente: [], reloj: 0, listo: false, mira: false, rapida: !!o.rapida, codigo: o.nombre?.length === 6 ? o.nombre : 'K4PL2Z' };
    const llegar = (nom, tuyo = false) => {
        if (!sala) return;
        const i = sala.cartas.length;
        const c = hacerCarta({ palo: tuyo ? 'TÚ' : '#' + (i + 1), nombre: nom, nota: tuyo ? '' : 'Conectado' }, tuyo ? 'jugador tuya' : 'jugador');
        c.disabled = true;
        c.style.transition = 'none';
        const [x, y] = posJugador(i, max);
        pon(c, x + (Math.random() - .5) * 200, -220, (Math.random() - .5) * 60, 1.2);
        zona.prepend(c);
        sala.cartas.push(c);
        // ponytail: Elo de ejemplo; en Piles lo manda el servidor con cada jugador
        sala.gente.push({ nombre: nom, listo: false, bot: false, elo: tuyo ? miElo.v : 950 + Math.floor(Math.random() * 520) });
        if (!tuyo) setTimeout(() => { const q = sala?.gente.find(x => x.nombre === nom); if (q) { q.listo = true; sincronizar(); } }, 1500 + Math.random() * 3000);
        requestAnimationFrame(() => requestAnimationFrame(() => { c.style.transition = ''; pon(c, x, y, (i % 2 ? 1 : -1) * 3, .56); }));
        decir('', tuyo ? T('Entraste en {c}', { c: sala.codigo }) : T('{n} entró', { n: nom }), true);
        vibrar(8);
        sincronizar(true);
    };
    sala.llegar = llegar;
    llegar(nombre.value.trim() || 'Tú', true);
    for (let k = 0; k < (o.hay ?? 0); k++) setTimeout(() => llegar(['Ana', 'Beto', 'Coca', 'Dani', 'Eli'][k]), 250 + k * 160);
    const NOMBRES = ['Fede', 'Gala', 'Hugo', 'Ines', 'Juan'];
    let j = 0;
    sala.siguiente = () => {
        if (!sala || sala.cartas.length >= max) return;
        llegar(NOMBRES[j++ % NOMBRES.length]);
        sala.reloj = setTimeout(sala.siguiente, 1700 + Math.random() * 1200);
    };
    // Partida rápida: nadie viene; a los 5 s, la oferta de bots (en Piles, a los 12 s)
    if (o.rapida) sala.reloj = setTimeout(ofrecerBots, 5000);
    else sala.reloj = setTimeout(sala.siguiente, 2200);
}
function salirSala() {
    if (!sala) return;
    clearTimeout(sala.reloj);
    sala.cartas.forEach(c => { pon(c, pilaX(), -260, 20, 1); setTimeout(() => c.remove(), 600); });
    sala = null;
    sincronizar();
}
// La sala, en la mesa: cada asiento ocupado tiene su figura; los vacíos, la silla vacía.
// Lámpara encendida sobre quien está listo; medalla y borde con su Elo.
const X = escena.X;
let miElo = { v: 1000, pool: 'fun' };
function sincronizar(llega = false) {
    X.tu = sala && !sala.mira ? 0 : -1;   // tu figura (asiento 0) lleva contorno bermellón
    if (!sala) {
        X.ocupados = [true, true, true, true]; X.listos = [false, false, false, false]; X.nombres = null;
        X.elo = escena.ELO_TOP.map(e => ({ ...e }));
        return;
    }
    const pool = sala.gente.some(q => q.bot) ? 'fun' : 'glory';
    for (let p = 0; p < 4; p++) {
        const q = sala.gente[p];
        if (q && !X.ocupados[p] && llega) X.llegada[p] = escena.ahora();
        X.ocupados[p] = !!q;
        X.listos[p] = !!q?.listo;
    }
    X.nombres = [0, 1, 2, 3].map(p => sala.gente[p]?.nombre ?? '');
    X.elo = [0, 1, 2, 3].map(p => sala.gente[p] && { v: sala.gente[p].elo, pool });
    const n = sala.gente.length, r = sala.gente.filter(q => q.listo).length;
    if (EN_SALA.has(pantalla) && pantalla !== 'cuenta' && pantalla !== 'oferta')
        estado.textContent = T('{n}/{max} en la sala · {r} de {n} listos · {pool}', { n, max: sala.max, r, pool: T(pool === 'fun' ? 'For fun · con bots' : 'For glory · solo personas') });
    if (sala.listo && n === sala.max && r === n && !sala.cuenta) cuentaAtras();
}
// ── Campo de texto: sale cuando hace falta escribir ─────────────────────────────
const campo = document.getElementById('campo');
let alEnviar = null, alEscribir = null;
function pedir(ph, max, enviar, escribir = null) {
    campo.value = ''; campo.placeholder = ph; campo.maxLength = max;
    colocarTextos();
    campo.style.textTransform = max === 6 ? 'uppercase' : '';
    alEnviar = enviar; alEscribir = escribir;
    campo.classList.add('abierto'); esc.classList.add('escribiendo');
    campo.focus();
}
function cerrarCampo() { campo.classList.remove('abierto'); esc.classList.remove('escribiendo'); campo.blur(); alEnviar = alEscribir = null; }
campo.addEventListener('input', () => alEscribir?.(campo.value.trim().toUpperCase()));
campo.addEventListener('keydown', e => {
    if (e.key === 'Enter' && campo.value.trim()) { const f = alEnviar; const v = campo.value.trim(); cerrarCampo(); f?.(v); }
    else if (e.key === 'Escape') cerrarCampo();
    e.stopPropagation();
});
const aviso = (txt, ms = 1600) => { estado.textContent = txt; clearTimeout(aviso.t); aviso.t = setTimeout(() => (estado.textContent = ''), ms); };
const salta = c => c?.animate([{ translate: '0 0' }, { translate: '0 -40px' }, { translate: '0 0' }], { duration: 420, easing: 'cubic-bezier(.34,1.56,.64,1)' });
function botALaSala(dif) {
    const i = sala.cartas.length;
    const b = hacerCarta({ palo: 'i:bot', nombre: 'Bot ' + i, nota: dif }, 'jugador listo');
    b.disabled = true; b.style.transition = 'none';
    const [x, y] = posJugador(i, sala.max);
    pon(b, pilaX(), pilaY(), 0, .7); zona.prepend(b); sala.cartas.push(b);
    decir('', T('Bot {i} ({d}) se sentó', { i, d: T(dif) }), true);
    sala.gente.push({ nombre: 'Bot ' + i, listo: true, bot: true, elo: { 'Fácil': 900, 'Normal': 1100, 'Difícil': 1350 }[dif] ?? 1100 });
    requestAnimationFrame(() => requestAnimationFrame(() => { b.style.transition = ''; pon(b, x, y, (i % 2 ? 1 : -1) * 3, .56); }));
    sincronizar(true);
}
/** Saca a alguien de la sala (bot quitado o echado por votación). */
function sacarDeSala(i) {
    const c = sala.cartas[i];
    decir('', T('{n} salió', { n: sala.gente[i].nombre }), true);
    pon(c, W() + 200, -200, 40, 1); setTimeout(() => c.remove(), 600);
    sala.cartas.splice(i, 1); sala.gente.splice(i, 1);
    sala.cartas.forEach((x, k) => { const [px, py] = posJugador(k, sala.max); pon(x, px, py, (k % 2 ? 1 : -1) * 3, .56); });
    sincronizar();
}

// ── Partida rápida sin nadie: «No hay oponentes dignos…» y la cámara por las sillas vacías ──
function ofrecerBots() {
    if (!sala || sala.gente.length > 1 || pantalla !== 'sala') return;
    pantalla = 'oferta'; esc.dataset.p = 'oferta';
    escena.camara('vacias');
    estado.textContent = T('No hay oponentes dignos...'); formas();
    retirarMano(); setTimeout(() => repartir(MENUS.oferta, 1), 160);
}
function cerrarOferta() {
    pantalla = 'sala'; esc.dataset.p = 'sala';
    escena.ir('sala', historial.length);
    retirarMano(); setTimeout(() => repartir(MENUS.sala, -1), 160);
    sincronizar(); formas();
}

// ── Cuenta atrás: desde arriba, las cartas del centro forman 3, 2, 1, ¡YA! ──────
const LETRAS = {   // 5×7
    3: ['11110', '00001', '00001', '01110', '00001', '00001', '11110'],
    2: ['01110', '10001', '00001', '00110', '01000', '10000', '11111'],
    1: ['00100', '01100', '00100', '00100', '00100', '00100', '01110'],
    Y: ['10001', '10001', '01010', '00100', '00100', '00100', '00100'],
    A: ['01110', '10001', '10001', '11111', '10001', '10001', '10001'],
    '!': ['1', '1', '1', '1', '1', '0', '1'],
};
const matrizDe = txt => {   // texto en LETRAS, con un hueco entre letras; 1 = carta, 0 = sin carta
    const filas = Array.from({ length: 7 }, () => []);
    [...txt].forEach((ch, i) => LETRAS[ch].forEach((f, r) => filas[r].push(...(i ? [false] : []), ...[...f].map(b => b === '1'))));
    return filas;
};
function cuentaAtras() {
    // Primero, en la misma toma de la sala, uno de los dos de la pelea arranca la carta y la alza;
    // luego la cámara sube y las cartas forman 3, 2, 1, ¡YA!
    const GANA = 1800;
    sala.cuenta = { timers: [] };
    historial.push(pantalla); pantalla = 'cuenta';
    escena.ganar(); vibrar(25);
    if (!ancho()) formas();   // en el móvil el chat se pliega: taparía la carta alzada
    mano.forEach(x => pon(x, W() / 2 - 64, H() + 80, 0, .8));
    estado.textContent = T('Desmárcate (↓) para cancelar'); colocarTextos();
    sala.cuenta.timers.push(setTimeout(() => { esc.dataset.p = 'cuenta'; escena.camara('cuenta'); formas(); }, GANA));
    ['3', '2', '1', 'YA!'].forEach((k, i) => sala.cuenta.timers.push(setTimeout(() => { escena.mosaico(matrizDe(k), 0.13, true); vibrar(30); }, GANA + 300 + i * 950)));
    sala.cuenta.timers.push(setTimeout(() => { escena.mosaico(null); historial.pop(); pantalla = 'sala'; empezarPartida(); }, GANA + 300 + 4 * 950));
}
function cancelarCuenta(motivo) {
    sala.cuenta.timers.forEach(clearTimeout); sala.cuenta = null;
    escena.mosaico(null);
    sala.listo = false; sala.gente[0].listo = false;
    pantalla = historial.pop(); esc.dataset.p = pantalla;
    escena.ir(pantalla, historial.length);
    repartir(MENUS[pantalla], -1);
    sincronizar(); formas();
    aviso(T('Cuenta atrás cancelada · {m}', { m: T(motivo) }), 2400);
}

// ── Cada pantalla, su toma: lo que entra y sale de la escena al cambiar de menú ──────
const sm = { codigo: '' };
const PERFIL = new Set(['perfil', 'sm', 'smElo', 'burla']);
/** Ir a una pantalla sin carta jugada (la cabecera es un rótulo). */
function irA(destino, titulo, o = {}) {
    const t = hacerCarta({ nombre: titulo }); zona.append(t); pon(t, pilaX(), pilaY(), 0, .8);
    setTimeout(() => cambiar(destino, t, o), 30);
}
/** Los menús que dependen de algo: a quién echar (la carta del jugador que tocaste). */
function preparaMenu(destino, o = {}) {
    if (destino === 'echar') MENUS.echar = [
        { palo: 'i:fuera', nombre: `Echar a ${sala.gente[o.idx].nombre}`, nota: 'Votan todos: si alguien dice no, se queda', accion: 'echar', idx: o.idx },
        { palo: 'i:volver', nombre: 'Mejor no', nota: 'Volver a la sala', accion: 'volver' },
    ];
}
function alCambiar(antes, ahora) {
    // Tu perfil: tu figura (asiento 0) lleva tu nombre y tu Elo
    if (PERFIL.has(ahora) && !sala) { X.nombres = [nombre.value.trim() || 'Tú', 'Beto', 'Coca', 'Dani']; X.elo[0] = { ...miElo }; X.tu = 0; }
    else if (!sala) sincronizar();
    X.marca = ahora === 'echar' ? (MENUS.echar[0]?.idx ?? -1) : -1;   // a quién se vota echar, señalado en bermellón
    formas(ahora);
    if (antes === 'sm' && ahora !== 'smElo') X.placa = null;
    if (ahora === 'sm') X.placa = { txt: sm.codigo, ok: !!sm.codigo };
    if (antes === 'qr') escena.mosaico(null);
    if (ahora === 'qr') mostrarQR();
    if (antes === 'visor') pararVisor();
    if (ahora === 'visor') abrirVisor();
    if (ahora === 'unirse') X.mesas = MENUS.unirse.slice(0, 3).map((s, i) => ({
        x: [-5.2, 0, 5.2][i], z: [-4, -7.5, -4][i], desfase: 40 + i * 23, jugando: !!s.jugando,
        ocup: [0, 1, 2, 3].map(p => p < s.hay),
    }));
    else if (!['visor', 'mirar'].includes(ahora)) X.mesas = null;
    if (ahora === 'mirar') { aviso(T('Estás mirando · {c}', { c: 'R7DN2B' }), 2600); X.nombres = ['Ana', 'Beto', 'Coca', 'Dani']; }
}
/** Al pasar por una carta (sin jugarla): la cámara o la figura reaccionan. */
function alElegirCarta() {
    const o = MENUS[pantalla]?.[sel]; if (!o) return;
    if (pantalla === 'unirse') escena.aMesa(sel);
    if (pantalla === 'echar' && o.idx) escena.aAsiento(o.idx);
    if (pantalla === 'burla' && o.nombre !== 'Ninguna') { X.burla = escena.ahora(); sonarBurla(sel); }
}

// QR de la sala: lo forman las cartas del centro, vistas desde arriba (se puede escanear)
function mostrarQR() {
    const url = `https://piles.danassistantassistant.website/lobby.html?join=${sala?.codigo ?? 'K4PL2Z'}`;
    if (typeof qrcode !== 'function') { aviso(T('No se pudo cargar el generador de QR')); return; }
    const q = qrcode(0, 'L'); q.addData(url); q.make();
    const n = q.getModuleCount(), m = [], borde = 2;
    for (let r = -borde; r < n + borde; r++) { const f = []; for (let c = -borde; c < n + borde; c++) f.push(r >= 0 && c >= 0 && r < n && c < n && q.isDark(r, c)); m.push(f); }
    escena.camara('qr');
    escena.mosaico(m, 1.5 / (n + 2 * borde));
}
// Escáner: la cámara del móvil en el centro de la mesa, entre cuatro esquinas de cartas
let flujo = null, buscaQR = 0;
async function abrirVisor() {
    X.visor = { t0: escena.ahora(), video: null };
    try {
        flujo = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        const v = document.createElement('video');
        v.muted = true; v.playsInline = true; v.srcObject = flujo; await v.play();
        if (!X.visor) { pararVisor(); return; }
        X.visor.video = v;
        if ('BarcodeDetector' in window) {
            const det = new BarcodeDetector({ formats: ['qr_code'] });
            buscaQR = setInterval(async () => {
                const r = await det.detect(v).catch(() => []);
                const txt = r[0]?.rawValue; if (!txt) return;
                const cod = (txt.match(/join=([A-Z0-9]{6})/i)?.[1] ?? txt).toUpperCase().slice(0, 6);
                clearInterval(buscaQR); aviso(`QR: ${cod}`); vibrar(40);
                setTimeout(() => { volver(); setTimeout(() => irA('sala', cod), 500); }, 600);
            }, 300);
        } else aviso(T('Este navegador no lee QR: escribe el código'), 3000);
    } catch { aviso(T('No se pudo abrir la cámara. Escribe el código a mano.'), 3000); }
}
function pararVisor() {
    clearInterval(buscaQR);
    flujo?.getTracks().forEach(t => t.stop()); flujo = null;
    X.visor = null;
}
// Burlas: un sonido corto sintetizado (el de Piles es un archivo) y tu figura se sacude
let audio = null;
function sonarBurla(i) {
    try {
        audio ??= new AudioContext();
        const [tipo, f0, f1, dur] = [['square', 330, 260, .35], ['sawtooth', 300, 120, .9], ['sine', 200, 700, .3], ['square', 500, 300, .6], ['sawtooth', 90, 70, .5],
            ['triangle', 600, 900, .8], ['sine', 1400, 300, .7], ['triangle', 1300, 1300, .5], ['sawtooth', 500, 900, .4], ['square', 420, 380, .25]][i] ?? ['sine', 440, 440, .2];
        const o = audio.createOscillator(), gn = audio.createGain(), t0 = audio.currentTime;
        o.type = tipo; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
        gn.gain.setValueAtTime(0.12, t0); gn.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
        o.connect(gn).connect(audio.destination); o.start(t0); o.stop(t0 + dur);
    } catch { /* sin audio */ }
}
// Conexión: la lámpara parpadea, todo se congela sin color; vuelve la luz al reconectar
function simularCorte() {
    X.cortado = true; escena.congelar(true);
    let n = 0;
    const intento = () => {
        n++;
        estado.textContent = T('Se perdió la conexión. Reintentando… (intento {n})', { n });
        if (n < 3) setTimeout(intento, 1300);
        else setTimeout(() => { X.cortado = false; escena.congelar(false); aviso(T('Conectado al servidor'), 1800); }, 1300);
    };
    intento();
}

    try { const s = localStorage.getItem('piles.proto.lang'); if (s in LENGUAS) return s; } catch { /* modo privado */ }
    const n = (navigator.language || '').toLowerCase();
    return n.startsWith('zh') ? '中文' : n.startsWith('en') ? 'EN' : 'ES';
})();
/** El texto en el idioma activo (si falta, en español); {x} se sustituye. */

    const i = LENGUAS[idioma] ?? -1;

}

    Array.from({ length: max - min + 1 }, (_, k) => `<span${k + min === v ? ' class="ya"' : ''}>${k + min}</span>`).join('') + '</span></span>';

    else if (e.key === 'ArrowUp' || e.key === 'Enter') jugar();
    else if (e.key === 'ArrowDown' || e.key === 'Escape' || e.key === 'Backspace') volver();
    else if (e.key === 'd' || e.key === 'D') simularCorte();   // prototipo: probar la caída de conexión
    else return;
    e.preventDefault();
});
